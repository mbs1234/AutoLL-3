name: Build and deploy AutoLL-3

# The app bundle and the static site around it live on two different
# branches with no shared history:
#
#   main - TypeScript/React source. `vite build` emits ONLY bg1.js,
#            bg1.css, responder.html and their chunks (see the
#            rollupOptions.input list in vite.config.mts).
#   goofy  - upstream's published Pages output. It is the only place the
#            surrounding site exists: index.html (which generates the
#            bookmarklet), start.html, news.html, contact.html,
#            autoloader.user.js, icon.png, index.css.
#
# Building main alone gives you an app with no way to install or launch
# it. This workflow builds fresh code from main, then overlays the static
# pages from goofy, then repoints upstream URLs at this fork.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_checks:
        description: >-
          Park emergency only: publish without running tests or typecheck.
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Origin this fork is served from. Must match `base` in vite.config.mts
  # and the responderPage URL in src/components/LoginForm.tsx.
  PAGES_ORIGIN: https://mbs1234.github.io/AutoLL-3

jobs:
  build:
    runs-on: ubuntu-latest
    # The gate below puts jest on the publish path, and a hung job is worse
    # than a failed one: it holds the deploy for GitHub's 360-minute default
    # while showing in progress rather than red. This suite drives a polling
    # loop under fake timers, so a hang is a real shape of failure here.
    timeout-minutes: 15
    steps:
      - name: Check out source (main)
        uses: actions/checkout@v4

      - name: Check out static site (goofy)
        uses: actions/checkout@v4
        with:
          # AutoLL-3 owns main; the inherited installer assets remain in the
          # reviewed AutoLL-2 source repository until they are independently
          # maintained here.
          repository: mbs1234/AutoLL-2
          ref: goofy
          path: goofy-static

      # The base's own published output. `sensor-data.js` is loaded at runtime
      # by a dynamic import rather than bundled, so it has to be shipped
      # alongside the build, and it has to be *this* copy -- `goofy` carries a
      # different vintage of the same filename, and pairing that with this
      # bundle fails in a way that is hard to read.
      - name: Check out base static output (gh-pages)
        uses: actions/checkout@v4
        with:
          repository: mbs1234/AutoLL-2
          ref: gh-pages
          path: base-static

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The gate. `deploy` below is `needs: build` with no `if:`, so a failure
      # here skips the publish and Pages keeps serving the bundle already
      # live. Deliberately steps in this job rather than a dependency on the
      # Check workflow: nothing new to trigger, no second workflow whose
      # rename or trigger failure disarms this silently, and no top-level
      # `permissions`/`concurrency` to re-scope onto a job that runs `npm ci`.
      #
      # Typecheck first because it is the actual gap. `build:fork` is bare
      # `vite build`, and esbuild strips types without checking them, so a
      # type error has always reached the phone: on AutoLL-2 6904dda the
      # Typecheck step failed with five errors and the next step built a
      # 361 kB bundle. `tsc --noEmit` is the only typechecker either repo has.
      #
      # Lint deliberately does NOT gate. Eight of the thirteen red checks on
      # this branch were formatting alone, the bundle was fine in every one of
      # them, and with no local Node there is no way to clear a prettier nit
      # except another push and another round trip. Check reports it; the
      # publish does not wait on it.
      #
      # `format('{0}', ...)` rather than `!inputs.skip_checks`: a CLI dispatch
      # sends the input as a string, and "false" is truthy in an Actions
      # expression -- so the direct form would silently disable the gate on
      # `gh workflow run -f skip_checks=false`. On a push the input is null,
      # which formats to "" and runs the gate.
      - name: Typecheck (gate)
        if: ${{ format('{0}', inputs.skip_checks) != 'true' }}
        run: npm run typecheck

      # `!cancelled()` so one push reports both, as Check does: a round trip
      # is the only feedback loop there is.
      - name: Tests (gate)
        if: ${{ format('{0}', inputs.skip_checks) != 'true' && !cancelled() }}
        run: npm run test:ci

      - name: Build app bundle
        run: npm run build

      - name: Overlay static site from goofy
        run: |
          set -euo pipefail
          # Only files the mickey build does not emit. Build outputs
          # (bg1.js, bg1.css, responder.html, wdw.js, chunks) are
          # deliberately not copied, so freshly built code always wins.
          #
          # Also deliberately skipped:
          #   diu.js, dlr.js - upstream's Disneyland modules; this build has
          #                    no Disneyland client and never loads them
          #   google*.html   - upstream's Google site-verification token
          for f in index.html index.css icon.png start.html news.html \
                   contact.html autoloader.user.js; do
            if [ -f "goofy-static/$f" ]; then
              cp "goofy-static/$f" "dist/$f"
              echo "overlaid $f"
            elif [ "$f" = index.html ] || [ "$f" = autoloader.user.js ]; then
              # The two install paths: index.html generates the bookmarklet,
              # autoloader.user.js is what the userscript loads. Publishing
              # without either is publishing a site with no way into it, which
              # is worth failing the deploy over. The rest are pages a link
              # points at, where a 404 costs less than a blocked publish.
              echo "::error::goofy-static/$f not found; the site would have no way to install it"
              exit 1
            else
              echo "::warning::goofy-static/$f not found, skipped"
            fi
          done

      - name: Overlay runtime modules from the base
        run: |
          set -euo pipefail
          # Not a build output and not bundled: `src/api/sensor-data.ts` loads
          # this by dynamic import at runtime, resolved next to bg1.js. Absent,
          # the import rejects with an error carrying no HTTP status, so
          # `useDataLoader` falls through to "Unknown error occurred" and every
          # booking fails for a reason the message does not name. Taken from
          # gh-pages rather than goofy on purpose -- see the checkout step.
          if [ -f "base-static/sensor-data.js" ]; then
            cp "base-static/sensor-data.js" "dist/sensor-data.js"
            echo "overlaid sensor-data.js"
          else
            echo "::error::base-static/sensor-data.js not found; booking will fail"
            exit 1
          fi

      - name: Repoint upstream URLs at this fork
        run: |
          set -euo pipefail
          # index.html and autoloader.user.js hardcode joelface.github.io/bg1.
          # Left unrewritten, the bookmarklet would silently load upstream's
          # build instead of this one.
          find dist -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 \
            | xargs -0 --no-run-if-empty \
                sed -i "s|https://joelface\.github\.io/bg1|$PAGES_ORIGIN|g"
          echo "--- remaining 'joelface' references ---"
          echo "(github.com/joelface/bg1 source links are expected and kept:"
          echo " GPL-3.0 attribution. bg1.joelface.com is the upstream time-sync"
          echo " and live-data host, still in use.)"
          grep -rn 'joelface' dist || echo "none"

      # A Pages deployment has no release attachment, so leave a small,
      # inspectable record in the published artifact itself. It covers every
      # payload file, including chunks and the runtime module, and is
      # generated only after every overlay and URL rewrite has completed, so
      # it describes what is actually published.
      #
      # It records all three source revisions, because `dist` is assembled
      # from three branches: the bundle from this one, the installer pages
      # from `goofy`, and the runtime module from `gh-pages`. The commit that
      # triggered the run identifies only the first, so a build reproduced
      # from `sourceRevision` alone would not match what shipped.
      #
      # There is deliberately no `sha256sum --check` here. Re-reading the
      # files in the same step that just hashed them re-derives the same
      # answer and proves nothing; the manifest is a record for afterwards,
      # and what is worth failing the deploy over is a payload file MISSING,
      # which is checked below.
      - name: Create release manifest
        run: |
          set -euo pipefail
          goofy_rev=$(git -C goofy-static rev-parse HEAD)
          base_rev=$(git -C base-static rev-parse HEAD)
          (
            cd dist
            find . -type f \
              ! -name autoll3-files.sha256 \
              ! -name autoll3-release.json \
              -printf '%P\n' \
              | LC_ALL=C sort \
              | while IFS= read -r file; do sha256sum "$file"; done \
              > autoll3-files.sha256
            # Every file an install path needs by name. bg1.css and
            # responder.html were missing from this list, and they are the two
            # whose absence breaks the app quietly rather than loudly -- an
            # unstyled page, and a sign-in that never completes.
            for file in bg1.js bg1.css responder.html sensor-data.js \
                        index.html index.css autoloader.user.js; do
              # Anchored to end of line so a `.map` or a same-named file in a
              # subdirectory cannot satisfy the check for the real one.
              grep -Eq "  ${file//./\\.}$" autoll3-files.sha256 || {
                echo "::error::$file is absent from the release manifest"
                exit 1
              }
            done
            printf '{\n  "application": "AutoLL-3",\n  "sourceRevision": "%s",\n  "installerRevision": "%s",\n  "runtimeModuleRevision": "%s",\n  "fileManifest": "autoll3-files.sha256"\n}\n' \
              "$GITHUB_SHA" "$goofy_rev" "$base_rev" > autoll3-release.json
          )

      - name: Show what will be deployed
        run: ls -la dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
